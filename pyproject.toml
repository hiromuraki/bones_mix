[project]
name = "bones_mix"
version = "0.1.0"
requires-python = "==3.8.*"
dependencies = [
    # 核心大包
    "torch==2.0.0+cu118",
    "torchvision==0.15.1+cu118",
    "torchaudio==2.0.1+cu118",
    # OpenMMLab 体系
    "mmcv==2.1.0",
    "mmdet==3.2.0",
    "mmpose==1.3.2",
    # 你的业务杂项
    "addict==2.4.0",
    "einops==0.8.1",
    "filterpy==1.4.5",
    "matplotlib==3.7.5",
    "numba==0.58.1",
    "numpy==1.24.4",
    "opencv-python==4.13.0.92",
    "pandas==2.0.3",
    "scikit-image==0.21.0",
    "scipy==1.10.1",
    "timm==0.6.11",
    "tqdm==4.65.2",
    "yacs==0.1.8",
    "easydict>=1.13",
]

# ==============================================================
# 🎯 uv 的魔法核心：告诉 uv 去哪里找这些刁钻的包
# ==============================================================

[tool.uv.sources]
# 1. 让 uv 去专门的索引找 PyTorch，而不是去官方 PyPI 找 (避免下到 CPU 版)
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

# 2. 【终极杀招】直接甩给 uv 预编译好的 mmcv wheel 链接，彻底抛弃 mim！
# 这是 OpenMMLab 针对 cp38 + torch2.0.0 + cu118 的官方预编译包
mmcv = { url = "https://download.openmmlab.com/mmcv/dist/cu118/torch2.0.0/mmcv-2.1.0-cp38-cp38-manylinux1_x86_64.whl" }


# ==============================================================
# 定义额外的包索引源
# ==============================================================
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
